# Netlify configuration for Africa Web (React SPA + Video Streaming)

[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Content-Type = "video/mp4"
    Accept-Ranges = "bytes"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
